name: Hepsiburada İndirim Botu

on:
  schedule:
    - cron: "17 * * * *"    # saatte bir, her saatin 17. dakikasında (UTC)
  workflow_dispatch:         # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write            # sent.json dosyasını geri kaydedebilmek için

concurrency:
  group: indirim-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Teşhis dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teshis
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Gönderilenler listesini kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --staged --quiet || (git commit -m "sent.json güncellendi" && git push)
